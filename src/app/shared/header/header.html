@if (branding.value(); as empresa) {
  <header class="cab">
    <a class="cab-logo-link" [routerLink]="['/', empresa.codigo]" [attr.aria-label]="empresa.nombre">
      <img class="cab-logo" src="fuerte-itaka-logo.png" [alt]="empresa.nombre" />
    </a>
    <app-selector-idioma />
  </header>
} @else if (branding.isLoading()) {
  <header class="cab">
    <div class="cab-logo-skeleton shimmer"></div>
    <app-selector-idioma />
  </header>
}
